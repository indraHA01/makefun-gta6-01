<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>SOLMAR — an open-world crime story</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1530; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #fallback { position: fixed; inset: 0; display: none; place-items: center; color: #f2f4f8;
    font: 16px system-ui, sans-serif; text-align: center; padding: 24px; }
</style>
</head>
<body>
<canvas id="game" aria-label="SOLMAR: an open-world crime game. Walk and drive around Solmar Bay, steal cars, outrun the police and complete missions."></canvas>
<p id="status" role="status" aria-live="polite">SOLMAR is loading. Press Enter on the title screen to start.</p>
<noscript><p style="color:#fff;font:16px system-ui">SOLMAR needs JavaScript to play.</p></noscript>
<div id="fallback">SOLMAR needs JavaScript and a modern desktop browser to play.</div>
<script>
  // If the module fails to load, say so in plain text instead of a black screen.
  window.addEventListener('error', function (e) {
    var f = document.getElementById('fallback');
    if (f && !window.__solmar) { f.style.display = 'grid'; f.textContent = 'SOLMAR could not start: ' + (e.message || 'module failed to load'); }
  });
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
